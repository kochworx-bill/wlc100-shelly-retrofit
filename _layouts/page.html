---
layout: default
---
<article class="post">

  <header class="post-header">
  {%- if page.icon -%}
  <img class="page-icon" src="{{ page.icon | relative_url }}" alt="">
  {%- endif -%}
  <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  {%- include page-disclaimer.html -%}

  <div class="post-content">
    {{ content }}
  </div>

</article>
